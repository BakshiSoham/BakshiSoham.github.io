# preview overrides it via _config.local.yml.
github:
  url: "https://bakshisoham.github.io"

# Build
markdown:     kramdown
highlighter:  rouge
permalink:    /:title
plugins:      [jekyll-sitemap, jekyll-feed, jekyll-seo-tag]
