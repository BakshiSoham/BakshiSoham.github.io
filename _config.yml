# Site
title:        'Soham Bakshi'
description:  'Ph.D. candidate in Statistics at the University of Michigan.'
author:       'Soham Bakshi'

baseurl: ""
url: "https://bakshisoham.github.io"

# The layouts reference {{ site.github.url }}, which is normally injected by
# jekyll-github-metadata on GitHub's legacy builder. This site is built by
# GitHub Actions with its own Gemfile, so define it explicitly. The local
# preview overrides it via _config.local.yml.
github:
  url: "https://bakshisoham.github.io"

# Build
markdown:     kramdown
highlighter:  rouge
permalink:    /:title
plugins:      [jekyll-sitemap, jekyll-feed, jekyll-seo-tag]

# Research notes live in _notes/ as YYYY-MM-DD-slug.md and are listed at /notes.
collections:
  notes:
    output: true
    permalink: /notes/:title

defaults:
  - scope: {type: notes}
    values: {layout: note}

# Repo files that are not part of the site.
exclude: [README.md, Gemfile, Gemfile.lock, vendor, .bundle, .claude]
